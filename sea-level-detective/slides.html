<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sea Level Detective in five slides · Poseidon SAR</title>
  <meta name="description" content="The Sea Level Detective slides by Team Poseidon SAR, NASA Space Apps 2026.">
  <style>
    @font-face { font-family: "IM Fell English"; src: url("vendor/fonts/im-fell-english-400-normal.woff2") format("woff2"); font-style: normal; font-display: swap; }
    @font-face { font-family: "IM Fell English"; src: url("vendor/fonts/im-fell-english-400-italic.woff2") format("woff2"); font-style: italic; font-display: swap; }
    :root { --ink: #27211b; --ink-soft: #6b5a43; --red: #8b3a2b; --paper: #f1ece1; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; color: var(--ink); font-family: "IM Fell English", Georgia, serif;
      background: radial-gradient(ellipse at 50% 30%, rgba(255,250,236,.9), rgba(236,227,207,0) 70%), #ece3cf;
      box-shadow: inset 0 0 140px rgba(96,64,28,.25); display: flex; flex-direction: column; align-items: center; }
    main { width: min(1040px, 100% - 32px); padding: 40px 0 56px; display: flex; flex-direction: column; gap: 18px; }
    .eyebrow { margin: 0; font-style: italic; color: var(--red); font-size: 1.05rem; }
    h1 { margin: 0; font-weight: 400; font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.08; text-wrap: balance; }
    .team { margin: 0; color: var(--ink-soft); font-style: italic; font-size: 1.1rem; }
    .frame { position: relative; padding: 10px; background: #f6f0e3; border: 1px solid rgba(59,38,20,.3); border-radius: 6px;
      box-shadow: 0 10px 30px rgba(59,38,20,.18); }
    .stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 3px; background: #efe8da; }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .45s ease; }
    .stage img.on { opacity: 1; }
    .nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px; }
    .nav button { font: inherit; font-size: 1.2rem; width: 46px; height: 40px; border-radius: 999px; border: 1px solid var(--ink);
      background: transparent; color: var(--ink); cursor: pointer; }
    .nav button:hover, .nav button:focus-visible { background: var(--red); border-color: var(--red); color: #f6efe0; outline: none; }
    .count { font-style: italic; color: var(--ink-soft); min-width: 5.5em; text-align: center; }
    .dots { display: flex; gap: 8px; }
    .dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1px solid var(--ink); background: transparent; cursor: pointer; }
    .dots button[aria-current="true"] { background: var(--ink); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
    .links a { font-style: italic; font-size: 1.15rem; padding: 8px 22px; border-radius: 999px; text-decoration: none;
      border: 1px solid var(--ink); color: var(--ink); transition: background .2s, color .2s; }
    .links a.primary { background: var(--ink); color: #f6efe0; }
    .links a:hover, .links a:focus-visible { background: var(--red); border-color: var(--red); color: #f6efe0; outline: none; }
    .note { margin: 0; color: var(--ink-soft); font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">NASA Space Apps 2026 · Team Poseidon SAR</p>
    <h1>Sea Level Detective in five slides</h1>
    <p class="team">Maxim Zyskin, Hanyue Shen and Ningzi Chen</p>
    <div class="frame">
      <div class="stage" id="stage" aria-live="polite">
        <img class="on" src="slides/slide_1.jpg" alt="Cover: Sea Level Detective, Team Poseidon SAR, with a NASA sea-height map of the November 2015 El Niño">
        <img src="slides/slide_2.jpg" alt="1 · The initiative: a clue from the far side of the planet, with storm-surge days per winter at the Battery, 1981–2025" loading="lazy">
        <img src="slides/slide_3.jpg" alt="2 · Mathematical modelling and results: tide removal, least squares with Fourier features, AR(1) error bars, the evidence funnel and the quasi-Poisson fits" loading="lazy">
        <img src="slides/slide_4.jpg" alt="3 · Visualizations: the East Coast and the West, a combined clue map and the lead-time curves, with the read-month strip" loading="lazy">
        <img src="slides/slide_5.jpg" alt="4 · What it tells us: a season’s warning from June, with three pen-and-ink plates of New York Harbor, flood preparations and the Port of Los Angeles" loading="lazy">
      </div>
      <div class="nav">
        <button type="button" id="prev" aria-label="Previous slide">◀</button>
        <div class="dots" id="dots"></div>
        <span class="count" id="count">1 of 5</span>
        <button type="button" id="next" aria-label="Next slide">▶</button>
      </div>
    </div>
    <div class="links">
      <a class="primary" href="./">Explore the globe →</a>
      <a href="video30.html">▶ 30-second video</a>
      <a href="video.html">▶ 1-minute video</a>
      <a href="slides/SeaLevelDetective_slides.pdf" download>Download the PDF</a>
    </div>
    <p class="note">Use the arrows, the dots or your keyboard’s ← → keys.</p>
  </main>
  <script>
    (function () {
      var imgs = document.querySelectorAll("#stage img"), dots = document.getElementById("dots"), count = document.getElementById("count"), k = 0;
      imgs.forEach(function (_, i) {
        var b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Slide " + (i + 1));
        b.addEventListener("click", function () { show(i); }); dots.appendChild(b);
      });
      function show(i) {
        k = (i + imgs.length) % imgs.length;
        imgs.forEach(function (im, j) { im.classList.toggle("on", j === k); });
        dots.querySelectorAll("button").forEach(function (b, j) { b.setAttribute("aria-current", String(j === k)); });
        count.textContent = (k + 1) + " of " + imgs.length;
      }
      document.getElementById("prev").addEventListener("click", function () { show(k - 1); });
      document.getElementById("next").addEventListener("click", function () { show(k + 1); });
      document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") show(k + 1); if (e.key === "ArrowLeft") show(k - 1); });
      show(0);
    })();
  </script>
</body>
</html>
